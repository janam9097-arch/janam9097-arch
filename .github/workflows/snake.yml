# ================================================================
# GitHub Actions workflow: generates the animated contribution snake
# Runs automatically every 24 hours and on every push to main.
# Output SVGs are committed to the "output" branch, which the
# README references directly.
# ================================================================

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  push:
    branches:
      - main
  workflow_dispatch: {}     # allows manual trigger from the Actions tab

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: janam9097-arch
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
